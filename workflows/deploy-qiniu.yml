name: Build & Deploy H5 Game to Qiniu

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build H5 game
        run: npm run build

      - name: Setup Qshell
        env:
          QINIU_AK: ${{ secrets.QINIU_AK || vars.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK || vars.QINIU_SK }}
        run: |
          set -euo pipefail
          if [[ -z "$QINIU_AK" || -z "$QINIU_SK" ]]; then
            echo "QINIU_AK and QINIU_SK must be configured as repository/environment secrets or variables."
            exit 1
          fi
          wget -q https://devtools.qiniu.com/qshell-v2.13.0-linux-amd64.tar.gz
          tar -zxf qshell-v2.13.0-linux-amd64.tar.gz
          sudo mv qshell /usr/local/bin/qshell
          qshell account "$QINIU_AK" "$QINIU_SK" qiniu-deploy-user

      - name: Upload to Qiniu Kodo
        env:
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET || vars.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "$QINIU_BUCKET" ]]; then
            echo "QINIU_BUCKET must be configured as a repository/environment secret or variable."
            exit 1
          fi
          qshell qupload2 \
            --src-dir=dist \
            --bucket="$QINIU_BUCKET" \
            --key-prefix=pinward/ \
            --overwrite \
            --rescan-local \
            --skip-fixed-strings=".DS_Store"
