name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 环境信息
        run: node --version
      - name: 语法检查
        run: npm run check
      - name: 单元与模拟测试
        run: npm test

  guard:
    name: guard
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ai/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 拒绝 AI 分支改动受保护路径
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -E '^(ops/|\.github/|CLAUDE\.md$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::AI 分支不得改动受保护路径：$(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -qE '^package\.json$'; then
            echo "::error::AI 分支不得改动 package.json"
            exit 1
          fi
